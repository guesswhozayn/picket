version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: picket-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    container_name: picket-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: picket-backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/picket
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-production_secret_change_me}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-production_refresh_secret_change_me}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: picket-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongodb_data:
  redis_data:
